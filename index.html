<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Analog Saat</title>
<style>
  :root {
    --bg: #eef1f5;
    --bg-glow: #ffffff;
    --face: #fbfcfd;
    --face-edge: #dfe4ea;
    --ring: #c9d0d9;
    --text: #1d2430;
    --muted: #6b7686;
    --tick: #9aa4b2;
    --tick-major: #2a3240;
    --hour: #1d2430;
    --minute: #2f3a4b;
    --second: #e2533b;
    --shadow: 0 30px 60px -20px rgba(30, 45, 70, .35), 0 10px 20px -10px rgba(30, 45, 70, .2);
    --btn-bg: rgba(255,255,255,.7);
    --btn-border: #d5dbe3;
  }
  :root[data-theme="dark"] {
    --bg: #0f1218;
    --bg-glow: #1b2130;
    --face: #171c26;
    --face-edge: #252c3a;
    --ring: #303a4c;
    --text: #e8ecf2;
    --muted: #8a94a6;
    --tick: #4a5568;
    --tick-major: #d4dae4;
    --hour: #eef1f6;
    --minute: #c9d1de;
    --second: #ff6a4d;
    --shadow: 0 30px 60px -20px rgba(0, 0, 0, .7), 0 10px 20px -10px rgba(0, 0, 0, .5);
    --btn-bg: rgba(30,36,48,.7);
    --btn-border: #2c3445;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at 50% 35%, var(--bg-glow), var(--bg) 70%);
    background-color: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2.2rem;
    padding: 16px;
    transition: background-color .4s, color .4s;
  }

  .clock {
    width: min(78vw, 60vh, 420px);
    aspect-ratio: 1;
    border-radius: 50%;
    box-shadow: var(--shadow);
  }
  .clock svg { width: 100%; height: 100%; display: block; }

  .face   { fill: var(--face); stroke: var(--face-edge); stroke-width: 1; transition: fill .4s; }
  .ring   { fill: none; stroke: var(--ring); stroke-width: 2; }
  .tick   { stroke: var(--tick); stroke-width: 1; stroke-linecap: round; }
  .tick.major { stroke: var(--tick-major); stroke-width: 2.6; }
  .num {
    fill: var(--text);
    font-size: 17px;
    font-weight: 500;
    text-anchor: middle;
    dominant-baseline: central;
    letter-spacing: -.02em;
  }
  .hand { stroke-linecap: round; }
  .hand.hour   { stroke: var(--hour);   stroke-width: 6; }
  .hand.minute { stroke: var(--minute); stroke-width: 4; }
  .hand.second { stroke: var(--second); stroke-width: 1.6; }
  .cap-outer { fill: var(--second); }
  .cap-inner { fill: var(--face); }

  .readout { text-align: center; }
  .digital {
    font-size: clamp(2rem, 7vw, 3.2rem);
    font-weight: 300;
    font-variant-numeric: tabular-nums;
    letter-spacing: .04em;
  }
  .digital .sec { color: var(--muted); }
  .date {
    margin-top: .35rem;
    font-size: clamp(.95rem, 3.2vw, 1.15rem);
    color: var(--muted);
    letter-spacing: .02em;
  }

  .theme-toggle {
    position: fixed;
    top: 16px;
    right: 16px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px solid var(--btn-border);
    background: var(--btn-bg);
    color: var(--text);
    cursor: pointer;
    display: grid;
    place-items: center;
    backdrop-filter: blur(8px);
    transition: transform .2s, background .4s;
  }
  .theme-toggle:hover { transform: rotate(-15deg) scale(1.05); }
  .theme-toggle svg { width: 20px; height: 20px; }
  .theme-toggle .moon { display: none; }
  :root[data-theme="dark"] .theme-toggle .sun { display: none; }
  :root[data-theme="dark"] .theme-toggle .moon { display: block; }
</style>
<script>
  // Tema: kayıtlı tercih yoksa sistem tercihine uy
  (function () {
    var saved = null;
    try { saved = localStorage.getItem("saat-tema"); } catch (e) {}
    var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.dataset.theme = dark ? "dark" : "light";
  })();
</script>
</head>
<body>
  <button class="theme-toggle" id="themeToggle" aria-label="Temayı değiştir" title="Açık / koyu tema">
    <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <circle cx="12" cy="12" r="4.5"/>
      <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
    </svg>
    <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>
    </svg>
  </button>

  <div class="clock" role="img" aria-label="Analog saat">
    <svg viewBox="0 0 200 200">
      <circle class="face" cx="100" cy="100" r="99"/>
      <circle class="ring" cx="100" cy="100" r="93"/>
      <g id="ticks"></g>
      <g id="numbers"></g>
      <line id="hourHand"   class="hand hour"   x1="100" y1="112" x2="100" y2="52"/>
      <line id="minuteHand" class="hand minute" x1="100" y1="116" x2="100" y2="28"/>
      <g id="secondHand">
        <line class="hand second" x1="100" y1="124" x2="100" y2="20"/>
        <circle cx="100" cy="124" r="3.2" fill="var(--second)"/>
      </g>
      <circle class="cap-outer" cx="100" cy="100" r="4.5"/>
      <circle class="cap-inner" cx="100" cy="100" r="1.8"/>
    </svg>
  </div>

  <div class="readout">
    <div class="digital" id="digital">00:00<span class="sec">:00</span></div>
    <div class="date" id="date"></div>
  </div>

<script>
  var NS = "http://www.w3.org/2000/svg";
  var ticks = document.getElementById("ticks");
  var numbers = document.getElementById("numbers");

  // Dakika çizgileri
  for (var i = 0; i < 60; i++) {
    var major = i % 5 === 0;
    var a = i * 6 * Math.PI / 180;
    var r1 = major ? 80 : 84, r2 = 88;
    var l = document.createElementNS(NS, "line");
    l.setAttribute("x1", 100 + r1 * Math.sin(a));
    l.setAttribute("y1", 100 - r1 * Math.cos(a));
    l.setAttribute("x2", 100 + r2 * Math.sin(a));
    l.setAttribute("y2", 100 - r2 * Math.cos(a));
    l.setAttribute("class", major ? "tick major" : "tick");
    ticks.appendChild(l);
  }

  // 1-12 rakamları
  for (var n = 1; n <= 12; n++) {
    var ang = n * 30 * Math.PI / 180;
    var t = document.createElementNS(NS, "text");
    t.setAttribute("x", 100 + 67 * Math.sin(ang));
    t.setAttribute("y", 100 - 67 * Math.cos(ang));
    t.setAttribute("class", "num");
    t.textContent = n;
    numbers.appendChild(t);
  }

  var hourHand = document.getElementById("hourHand");
  var minuteHand = document.getElementById("minuteHand");
  var secondHand = document.getElementById("secondHand");
  var digital = document.getElementById("digital");
  var dateEl = document.getElementById("date");

  var dateFmt = new Intl.DateTimeFormat("tr-TR", {
    weekday: "long", day: "numeric", month: "long", year: "numeric"
  });
  var pad = function (v) { return String(v).padStart(2, "0"); };
  var lastSecond = -1;

  function rotate(el, deg) {
    el.setAttribute("transform", "rotate(" + deg + " 100 100)");
  }

  function tick() {
    var now = new Date();
    var ms = now.getMilliseconds();
    var s = now.getSeconds() + ms / 1000;
    var m = now.getMinutes() + s / 60;
    var h = (now.getHours() % 12) + m / 60;

    rotate(secondHand, s * 6);
    rotate(minuteHand, m * 6);
    rotate(hourHand, h * 30);

    if (now.getSeconds() !== lastSecond) {
      lastSecond = now.getSeconds();
      digital.innerHTML = pad(now.getHours()) + ":" + pad(now.getMinutes()) +
        '<span class="sec">:' + pad(now.getSeconds()) + "</span>";
      dateEl.textContent = dateFmt.format(now);
      document.title = pad(now.getHours()) + ":" + pad(now.getMinutes()) + " · Analog Saat";
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  // Tema değiştirici
  document.getElementById("themeToggle").addEventListener("click", function () {
    var root = document.documentElement;
    var next = root.dataset.theme === "dark" ? "light" : "dark";
    root.dataset.theme = next;
    try { localStorage.setItem("saat-tema", next); } catch (e) {}
  });

  // Kullanıcı seçim yapmadıysa sistem teması değişince takip et
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function (e) {
    var saved = null;
    try { saved = localStorage.getItem("saat-tema"); } catch (err) {}
    if (!saved) document.documentElement.dataset.theme = e.matches ? "dark" : "light";
  });
</script>
</body>
</html>
